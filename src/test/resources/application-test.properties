# Force H2 for tests to avoid Supabase connection attempts
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Mock OAuth2 values so Spring Security doesn't crash on startup
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret

# Disable standard security logs for cleaner output
logging.level.org.springframework.security=ERROR

# Mail: a host must be set so Spring Boot's MailSenderAutoConfiguration creates
# the JavaMailSender bean that SmtpEmailService depends on. The host is never
# contacted in tests — integration tests mock EmailService outright and unit
# tests don't load the bean at all.
spring.mail.host=localhost
spring.mail.port=25
donatjs.email.from-address=test@example.com
donatjs.email.from-name=DonatJS Test
donatjs.email.near-target-threshold=0.98