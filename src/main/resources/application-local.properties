# =====================================================================
#  Local development profile (activated by default)
# =====================================================================
#  Zero-setup defaults – clone the repo, run `./gradlew bootRun`, done.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:donatjsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cookies cannot be secure-only on plain-HTTP localhost, otherwise the
# session cookie is silently dropped and login appears to "not stick".
server.servlet.session.cookie.secure=false
server.forward-headers-strategy=none

# Helpful SQL visibility for devs poking around the DB.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Ensure dev-tools restart works
spring.devtools.restart.enabled=true

logging.level.id.ac.ui.cs.advprog.donatjs=INFO
