# Loaded when spring.profiles.active includes "local" (default for ./gradlew bootRun).
# Generous balance so donation/subscription flows can be exercised without seeding.
donatjs.wallet.initial-balance=1000000

# Read templates directly from source so edits are reflected without restart.
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.cache=false

# Flyway not needed for local H2; Hibernate manages the schema.
spring.flyway.enabled=false

# =====================================================================
#  Email — Mailpit catch-all SMTP (https://mailpit.axllent.org)
# =====================================================================
# Run locally:  docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit
# Inbox UI:     http://localhost:8025
# Mailpit accepts every From address, requires no auth, and never relays
# outbound. Real recipients never see these messages.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1026}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=60000
spring.mail.properties.mail.smtp.timeout=60000
spring.mail.properties.mail.smtp.writetimeout=60000
