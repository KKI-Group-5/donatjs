# Connect to the in-memory database named 'donatjsdb'
spring.datasource.url=${DB_URL:jdbc:h2:mem:donatjsdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Let Hibernate automatically update or create tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Supabase pgBouncer (transaction mode) does not support prepared statements
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Enable the H2 web console so database is viewable in browser.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Fix for Production (Railway/Proxy)
# Ensures redirect_uri uses HTTPS and cookies are handled correctly
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Use for passwords
donatjs.local.test-user.password=password123