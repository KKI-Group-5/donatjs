# Connect to the in-memory database named 'donatjsdb'
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate automatically update or create tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Fix: PostgreSQL prepared statement "already exists" error with HikariCP
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Enable the H2 web console so database is viewable in browser.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Fix for Production (Koyeb/Proxy)
# Ensures redirect_uri uses HTTPS and cookies are handled correctly
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true