# =====================================================================
#  DonatJS – shared application configuration
# =====================================================================
#  The application ships with two Spring profiles:
#
#    * local      (default when no env is set)  – H2 in-memory DB,
#                                                 demo seed data,
#                                                 HTTP-friendly cookies.
#    * supabase   (activated automatically when  – Supabase/pgBouncer
#                 DB_URL env var is provided)     tuning & secure cookies.
#
#  See application-local.properties and application-supabase.properties
#  for profile-specific overrides.
# =====================================================================

# Default profile: plain `./gradlew bootRun` picks "local".
# Production sets SPRING_PROFILES_ACTIVE=supabase (see Procfile / Railway env).
spring.profiles.default=local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Hibernate manages the schema for @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Shared datasource (profile overrides decide which engine is used).
spring.datasource.url=${DB_URL:jdbc:h2:mem:donatjsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Google OAuth2 credentials (safe placeholders when unset so boot never fails).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-google-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# Seeded demo credentials (used by LocalDataInitializer under the local profile).
donatjs.local.test-user.password=${LOCAL_TEST_USER_PASSWORD:password123}
donatjs.local.admin-user.password=${LOCAL_ADMIN_USER_PASSWORD:admin123}

# Rp credited when a wallet is auto-created (first visit). Default 0; see application-local.properties.
donatjs.wallet.initial-balance=${DONATJS_WALLET_INITIAL_BALANCE:0}

# =====================================================================
#  Email (shared defaults — overridden per profile)
# =====================================================================
# Threshold (0.0–1.0) at which a "near target" email fires for a campaign
# that has been favorited by users.
donatjs.email.near-target-threshold=0.98
# Friendly From name shown in the email client.
donatjs.email.from-name=DonatJS
# From address. Profile properties override (Mailpit catch-all locally,
# verified Resend domain or onboarding@resend.dev in prod).
donatjs.email.from-address=${MAIL_FROM_ADDRESS:noreply@donatjs.local}

# =====================================================================
#  Actuator & Metrics
# =====================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=donatjs
