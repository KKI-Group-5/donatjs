<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | DonatJS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            padding: var(--spacing-2xl) 24px;
            background: var(--bg-light);
        }
        .auth-card {
            background: var(--white);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 var(--spacing-md);
            border: 1px solid var(--soft-gray);
            border-radius: var(--radius-md);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--kelly-green);
        }
        .btn-auth {
            width: 100%;
            height: 48px;
            background: var(--kelly-green);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: var(--spacing-sm);
        }
        .btn-auth:hover {
            background: var(--kelly-green-hover);
        }
        .auth-footer {
            margin-top: var(--spacing-xl);
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-link {
            color: var(--kelly-green);
            font-weight: 600;
        }
        .error-message {
            background: #FEE2E2;
            color: var(--danger);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: var(--spacing-lg) 0;
            color: var(--text-light);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--soft-gray);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 48px;
            background: var(--white);
            border: 1px solid var(--soft-gray);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .google-btn:hover {
            background: var(--bg-light);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to your DonatJS account</p>
        </div>

        <div th:if="${param.error}" class="error-message">
            Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="error-message" style="background: #ECFDF5; color: var(--kelly-green-hover);">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="username" class="form-input" placeholder="john@example.com" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn-auth">Log In</button>
        </form>

        <div class="divider">OR</div>

        <a th:href="@{/oauth2/authorization/google}">
            <button class="google-btn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.79 2.7l2.85 2.21c1.67-1.53 2.63-3.79 2.63-6.56z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.85-2.21c-.79.53-1.8.85-3.11.85-2.39 0-4.41-1.61-5.14-3.77L.95 13.44C2.43 16.14 5.48 18 9 18z" fill="#34A853"/>
                    <path d="M3.86 10.74c-.19-.56-.3-1.16-.3-1.77s.11-1.21.3-1.77L.95 4.88C.34 6.09 0 7.5 0 9s.34 2.91.95 4.12l2.91-2.38z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0 5.48 0 2.43 1.86.95 4.88l2.91 2.38c.73-2.16 2.75-3.77 5.14-3.77z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </a>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/register}" class="auth-link">Sign Up</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
