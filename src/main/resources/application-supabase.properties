# =====================================================================
#  Supabase / production profile
# =====================================================================
#  Activated automatically when DB_URL is present in the environment.
#  Applies pgBouncer-safe Hikari tuning & HTTPS-only cookies.
# =====================================================================

spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway manages schema changes; Hibernate only validates.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

# Supabase pgBouncer (transaction mode) does not support server-side
# prepared statements. Disable them and prefer the simple query protocol so we
# never see "prepared statement S_n already exists" / poisoned transactions.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# H2 console stays disabled in production.
spring.h2.console.enabled=false

# Behind Railway/Heroku-style reverse proxies, honour X-Forwarded-* headers
# and mark cookies secure so the session cookie survives the HTTPS hop.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# =====================================================================
#  Email — SMTP configuration (Defaults to Gmail App Password)
# =====================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:donatjsadpro@gmail.com}
spring.mail.password=${MAIL_PASSWORD:oojevlgjuhuskiht}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# =====================================================================
#  Observability (Actuator & Prometheus)
# =====================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=DonatJS
