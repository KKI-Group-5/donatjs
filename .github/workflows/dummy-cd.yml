name: Dummy CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging

jobs:
  ci-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Automated Tests
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport

      - name: Check test coverage gate
        run: ./gradlew test

  dummy-deployment:
    needs: ci-quality-check
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Execute Dummy Deployment
        run: |
          echo "CI Quality Checks passed successfully"
          echo "Simulating deployment to staging environment..."
          echo "Application image built and pushed to registry"
          echo "Staging environment updated"
          echo "Deployment successful — DonatJS is live on staging"
